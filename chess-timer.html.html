<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16833a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chess Timer</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: #ffffff;
  font-family: Arial, sans-serif;

  display: flex;
  flex-direction: column;
}

/* Both player squares */
.clock {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18vw;
  font-weight: bold;

  cursor: pointer;
}

/* Green side */
#green {
  background: #16833a;
  color: white;
}

/* White side */
#white {
  background: white;
  color: #16833a;
  border: 5px solid #16833a;
}

/* Active side */
.active {
  box-shadow: inset 0 0 0 8px #ffd700;
}

/* New Game area */
.controls {
  height: 65px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #16833a;
}

button {
  background: white;
  color: #16833a;

  border: none;
  border-radius: 8px;

  padding: 10px 22px;

  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(0.95);
}

/* Time over */
.game-over {
  background: #c62828 !important;
  color: white !important;
}
</style>
</head>

<body>

<!-- Green player -->
<div id="green"
     class="clock"
     onclick="tapClock('green')">
  5:00
</div>

<!-- Only button -->
<div class="controls">
  <button onclick="newGame()">New Game</button>
</div>

<!-- White player -->
<div id="white"
     class="clock"
     onclick="tapClock('white')">
  5:00
</div>


<script>

const START_TIME = 5 * 60;

let greenTime = START_TIME;
let whiteTime = START_TIME;

let activePlayer = "green";

let gameStarted = false;
let timer = null;


/* Show the time */
function displayTime(seconds) {

  let minutes = Math.floor(seconds / 60);
  let secs = seconds % 60;

  return minutes + ":" + String(secs).padStart(2, "0");
}


/* Update screen */
function updateDisplay() {

  document.getElementById("green").textContent =
    displayTime(greenTime);

  document.getElementById("white").textContent =
    displayTime(whiteTime);

  document.getElementById("green")
    .classList.toggle(
      "active",
      activePlayer === "green" && gameStarted
    );

  document.getElementById("white")
    .classList.toggle(
      "active",
      activePlayer === "white" && gameStarted
    );
}


/* Start the clock */
function startTimer() {

  clearInterval(timer);

  timer = setInterval(function() {

    if (activePlayer === "green") {
      greenTime--;
    } else {
      whiteTime--;
    }

    updateDisplay();

    /* Time is over */
    if (greenTime <= 0) {

      greenTime = 0;

      clearInterval(timer);
      gameStarted = false;

      document.getElementById("green")
        .classList.add("game-over");

      updateDisplay();
    }

    if (whiteTime <= 0) {

      whiteTime = 0;

      clearInterval(timer);
      gameStarted = false;

      document.getElementById("white")
        .classList.add("game-over");

      updateDisplay();
    }

  }, 1000);
}


/* Tap a player's side */
function tapClock(player) {

  /*
    First tap starts the game.
  */
  if (!gameStarted) {

    /* Don't start if the game is finished */
    if (greenTime <= 0 || whiteTime <= 0) {
      return;
    }

    activePlayer = player;
    gameStarted = true;

    document.getElementById("green")
      .classList.remove("game-over");

    document.getElementById("white")
      .classList.remove("game-over");

    updateDisplay();
    startTimer();

    return;
  }


  /*
    Only the player whose clock is running
    can press their side.
  */
  if (player !== activePlayer) {
    return;
  }


  /*
    Switch to the opponent.
  */
  if (activePlayer === "green") {
    activePlayer = "white";
  } else {
    activePlayer = "green";
  }

  updateDisplay();
}


/* New Game */
function newGame() {

  clearInterval(timer);

  greenTime = START_TIME;
  whiteTime = START_TIME;

  activePlayer = "green";
  gameStarted = false;

  document.getElementById("green")
    .classList.remove("game-over");

  document.getElementById("white")
    .classList.remove("game-over");

  updateDisplay();
}


/* Initial display */
updateDisplay();

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
